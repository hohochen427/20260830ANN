<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡客服｜星光家電</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">星光家電 Starlight Home</a>
    <nav>
      <a href="products.html">產品</a>
      <a href="faq.html">常見問題</a>
      <a href="policy.html">政策說明</a>
      <a href="contact.html">聯絡客服</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>聯絡客服</h1>
  <p class="tagline">讓每一個家，都有剛剛好的空氣。</p>

  <figure class="figure">
    <img src="images/contact-service.png" alt="桌上的筆電與便條紙"
         loading="eager" decoding="async"
         onerror="this.closest('.figure').hidden = true">
  </figure>

  <h2>客服信箱</h2>
  <p>客服信箱：<a href="mailto:service@starlight-demo.example">service@starlight-demo.example</a></p>

  <h2>銷售通路</h2>
  <p>目前只有官網銷售，沒有實體門市。</p>

  <h2>出貨時間</h2>
  <ul>
    <li>台灣本島：2 至 3 個工作天</li>
    <li>離島：5 至 7 個工作天</li>
  </ul>
  <p>目前配合的物流不支援指定到貨時間。</p>

  <h2>維修送修方式</h2>
  <p class="pending">請來信客服，信箱見頁尾。</p>
</main>

<footer>
  <div class="wrap">
    客服信箱：<a href="mailto:service@starlight-demo.example">service@starlight-demo.example</a>
  </div>
</footer>

</body>
</html>
